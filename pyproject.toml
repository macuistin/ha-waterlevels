[project]
name = "water_levels"
version = "0.2.0b2"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/water_levels"]
branch = true

[tool.coverage.report]
# CI runs pytest --cov, which fails below this. The Silver tier asks for over 95%.
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
# The Platinum tier asks for strict typing. CI runs mypy on the integration.
python_version = "3.13"
files = ["custom_components/water_levels"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle and pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "ASYNC",        # blocking calls in async code
    "LOG",          # logging misuse
    "PIE",
    "RUF",
    "C901", "PLR0912", "PLR0913", "PLR0915",  # Clean Code limits, set below
    "FBT001", "FBT002",                       # no boolean flag arguments
]
ignore = [
    "RUF012",  # Home Assistant class attributes are mutable by design
    "SIM105",  # try/except/pass reads more plainly than contextlib.suppress here
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.water_levels"]
combine-as-imports = true

# Clean Code limits. New code stays inside them. Existing offenders carry an inline
# `# noqa: <rule>` marker, and the change that fixes the function deletes it.
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 30
max-branches = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "FBT001", "FBT002"]
